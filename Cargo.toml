[package]
name = "alfred-calc"
version = "0.1.0"
edition = "2021"
description = "Natural-language currency, crypto and unit conversion for Alfred"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
